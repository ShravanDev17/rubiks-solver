<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik's Cube Solver</title>
  </head>
  <body>
    <div id="app">
      <h1>Rubik's Cube Solver</h1>
      <p class="hint">Pick a color, then click stickers to paint them. Centers are fixed.</p>
      <div id="palette"></div>
      <div id="net"></div>
      <div id="actions">
        <button id="solve">Solve</button>
        <button id="scramble">Scramble</button>
        <button id="demo">Fill solved</button>
        <button id="reset">Reset</button>
      </div>
      <div id="message"></div>
      <div id="solution"></div>
      <div id="viewer-section" hidden>
        <div id="viewer"></div>
        <p class="hint">Drag to rotate the view.</p>
        <div id="controls">
          <button id="restart">Restart</button>
          <button id="prev">Prev</button>
          <button id="play">Play</button>
          <button id="next">Next</button>
        </div>
        <div id="step-info">Step 0 / 0</div>
        <label class="speed">
          Speed
          <input id="speed" type="range" min="1" max="10" value="6" />
        </label>
      </div>
    </div>
    <script src="/cubejs/cube.js"></script>
    <script src="/cubejs/solve.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
